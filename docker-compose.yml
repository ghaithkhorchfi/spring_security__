version: '3'
services:
  postgres:
    container_name: postgres_container
    image: postgres
    user: root
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: candidate
    ports:
      - "5432:5432"
    restart: unless-stopped
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: test@mail.com
      PGADMIN_DEFAULT_PASSWORD: strongPwd
    ports:
      - "5050:80"
    depends_on:
      - postgres